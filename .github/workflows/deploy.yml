name: Verificări

# Site-ul se construieste si se publica de Coolify, pe serverul propriu. Aici raman verificarile:
# daca o salvare din admin strica testele sau build-ul, rularea asta cade, iar bara de publicare
# din admin spune „a esuat" in loc sa astepte degeaba.
on:
  push:
    branches: [main]
    # Codul adminului si documentatia nu schimba site-ul.
    paths-ignore: ['admin/**', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

# O singura verificare odata; rulari noi nu intrerup una in curs.
concurrency:
  group: verificari
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Verificări
        run: |
          npm test
          npx astro check

      - name: Build
        run: npm run build
