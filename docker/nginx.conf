server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  charset utf-8;
  charset_types text/css application/javascript application/json image/svg+xml;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # Adminul tine site-ul intr-un iframe la ecranul Aspect; altcineva nu are voie.
  add_header Content-Security-Policy "frame-ancestors 'self' https://admin.loxmobila.ro https://mrwebsites.ro https://www.mrwebsites.ro https://rtrsolutions.ro" always;

  # O singura adresa buna pentru fiecare pagina: www trimite la domeniul simplu.
  if ($host ~* ^www\.(.+)$) {
    return 301 https://$1$request_uri;
  }

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Adminul intreaba fisierul asta daca publicarea a ajuns pe server; nu are voie sa fie tinut in cache.
  location = /version.json {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Fisierele cu amprenta in nume nu se schimba niciodata.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location ~* \.(?:jpg|jpeg|png|webp|avif|svg|ico|woff2)$ {
    add_header Cache-Control "public, max-age=2592000" always;
  }

  # Paginile se verifica la fiecare cerere: ce salveaza clientul din admin trebuie sa apara imediat.
  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://admin.loxmobila.ro https://mrwebsites.ro https://www.mrwebsites.ro https://rtrsolutions.ro" always;
    try_files $uri $uri.html $uri/index.html =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
    add_header Cache-Control "no-cache" always;
  }
}
